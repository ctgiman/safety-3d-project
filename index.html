<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧工安互動教學系統</title>
    <style>
        :root { --primary: #3498db; --bg: #1a1a1a; --panel: rgba(30, 30, 30, 0.95); }
        body { margin: 0; font-family: 'Microsoft JhengHei', sans-serif; background: #000; color: white; overflow: hidden; }
        
        #container { 
            position: relative; width: 100vw; height: 100vh; display: flex; 
            overflow: hidden; 
        }

        /* 指引線畫布 */
        #line-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
        }

        /* 左側：部位清單 */
        #left-panel { position: absolute; left: 20px; top: 100px; width: 220px; z-index: 100; pointer-events: none; }
        .part-item {
            pointer-events: auto; background: var(--panel); border-left: 4px solid var(--primary);
            padding: 12px; margin-bottom: 8px; cursor: pointer; border-radius: 0 5px 5px 0;
            transition: 0.3s; font-size: 14px; box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        .part-item:hover { background: var(--primary); color: white; transform: translateX(8px); }

        /* 右側：物件清單 */
        #right-panel {
            position: absolute; right: 0; top: 0; bottom: 0; width: 280px;
            background: var(--panel); border-left: 1px solid #444; padding: 20px;
            z-index: 100; overflow-y: auto;
        }
        .category-title { color: #888; font-size: 12px; text-transform: uppercase; margin: 20px 0 10px; border-bottom: 1px solid #444; }
        .model-btn {
            width: 100%; padding: 12px; margin-bottom: 10px; background: #333; border: none;
            color: white; text-align: left; cursor: pointer; border-radius: 5px; transition: 0.3s;
        }
        .model-btn:hover { background: #444; }
        .model-btn.active { background: var(--primary); font-weight: bold; }

        #reset-btn {
            width: 100%; padding: 12px; background: #e67e22; color: white; border: none;
            border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px; transition: 0.3s;
        }
        #reset-btn:hover { background: #d35400; }

        /* 3D 標籤 */
        .annotation {
            position: absolute; width: 26px; height: 26px;
            background: #ff3d00; border: 2px solid #ffffff; border-radius: 50%;
            color: white; font-weight: bold; text-align: center; line-height: 22px;
            font-size: 12px; box-shadow: 0 0 15px rgba(255, 61, 0, 0.8);
            cursor: pointer; z-index: 1000; pointer-events: auto;
        }

        /* === 第一層資訊彈窗 (Level 1) === */
        #message-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 400px; max-width: 90vw;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid var(--primary);
            border-radius: 10px;
            padding: 0;
            z-index: 2000; /* 層級 2000 */
            display: none;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
            animation: fadeIn 0.3s ease-out;
        }

        #msg-img-container {
            width: 100%; background: #333; overflow: hidden; position: relative; display: none;
        }
        #msg-img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain;  /* ★ 改成 contain，圖片就會縮放至完整顯示，不被裁切 */
            background: #000;    /* 背景設為黑色，若圖片太長或太扁，旁邊會留黑邊而不是空白 */
        }
        .msg-body { padding: 20px; }
        #msg-title { margin-top: 0; color: var(--primary); font-size: 22px; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px; }
        #msg-content { line-height: 1.6; color: #ddd; font-size: 15px; margin: 0; }

        /* 詳細按鈕樣式 */
        #btn-more-info {
            display: none; width: 100%; margin-top: 15px; padding: 10px;
            background: var(--primary); color: white; border: none;
            border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold;
            transition: 0.2s;
        }
        #btn-more-info:hover { background: #2980b9; }

        /* === 第二層資訊彈窗 (Level 2 - 詳細構造) === */
        #message-box-level2 {
            position: absolute;
            top: 55%; left: 55%; /* 故意稍微錯開，讓使用者知道是疊在上面的 */
            transform: translate(-50%, -50%);
            width: 350px; max-width: 85vw;
            background: rgba(35, 35, 35, 0.98); /* 深一點的顏色 */
            border: 1px solid #e67e22; /* 橘色邊框區分 */
            border-radius: 10px;
            z-index: 2100; /* ★ 重點：比第一層大，所以會疊在上面 */
            display: none;
            box-shadow: 0 0 40px rgba(0,0,0,1);
            animation: fadeIn 0.3s ease-out;
            padding: 20px;
        }

        .close-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.5); border: none; color: white;
            width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; font-weight: bold; z-index: 10;
        }
        .close-btn:hover { background: var(--primary); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        #debug-tool {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.9); border: 1px solid #00ff00; color: #00ff00;
            padding: 10px; font-family: monospace; font-size: 11px; z-index: 300;
        }
    </style>
</head>
<body>

    <div id="container">
        <svg id="line-canvas"></svg>

        <div id="left-panel">
            <div style="color:var(--primary); margin-bottom:12px; font-weight:bold; letter-spacing:1px;">部位檢查指引</div>
            <div id="parts-list"></div>
        </div>

        <div id="right-panel">
            <button id="reset-btn">🏠 重置視角 / 置中</button>
            <h2 style="margin:0 0 15px 0; font-size: 20px;">工安器材庫</h2>
            <div class="category-title">防護具類</div>
            <div id="cat-ppe"></div>
            <div class="category-title">消防器材類</div>
            <div id="cat-fire"></div>
        </div>

        <div id="canvas-wrapper" style="flex: 1; width: 100%; height: 100%;"></div>
        <div id="labels-container"></div>

        <div id="message-box">
            <button class="close-btn" onclick="this.parentElement.style.display='none'; document.getElementById('message-box-level2').style.display='none';">✕</button>
            <div id="msg-img-container">
                <img id="msg-img" src="" alt="部位圖片">
            </div>
            <div class="msg-body">
                <h3 id="msg-title">標題</h3>
                <p id="msg-content">內容描述...</p>
                <button id="btn-more-info">🔍 查看詳細構造拆解</button>
            </div>
        </div>

        <div id="message-box-level2">
            <button class="close-btn" onclick="this.parentElement.style.display='none'">✕</button>
            <h3 id="msg-title-2" style="margin-top:0; color:#e67e22; border-bottom:1px solid #555; padding-bottom:10px;">詳細構造</h3>
            <img id="msg-img-2" src="" style="width:100%; border-radius:5px; margin:10px 0; display:none;">
            <p id="msg-content-2" style="color:#ddd; line-height:1.6; font-size:14px; margin:0;">更多細節...</p>
        </div>

        <div id="debug-tool">
            <button onclick="this.parentElement.style.display='none'">關閉工具</button><br>
            <strong>座標偵測器</strong> (點擊模型獲取)<br>
            <span id="coord-output">x: -, y: -, z: -</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Tween, Easing, update as updateTween } from 'https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js';

        // 1. 資料庫設定
        const allData = [
            {
                id: "helmet",
                category: "ppe",
                name: "工程安全帽",
                file: "./models/model3.glb",
                points: [
                    { title: "帽殼狀態", text: "檢查是否有龜裂或遭受撞擊之白化痕跡。", pos: { x: 0.007, y: 0.249, z: -0.028 } },
                    { title: "頤帶扣環", text: "確認扣環是否牢固，無斷裂痕跡。", pos: { x: 0.105, y: -0.101, z: -0.016 } },
                    { title: "內襯", text: "檢查緩衝材質是否老化、龜裂。", pos: { x: -0.123, y: 0.161, z: -0.017 } }
                ]
            },
            {
                id: "extinguisher",
                category: "fire",
                name: "乾粉滅火器",
                file: "./models/fireextinguisher.glb",
                points: [
                    { 
                        title: "壓力錶指針", 
                        text: "【正常範圍】：指針必須位於綠色區塊。\n【異常】：偏左(黃色)代表壓力不足；偏右(紅色)代表壓力過大。", 
                        // ★★★ 這裡就是連結本地圖片的地方 ★★★
                        // 請確保你的 images 資料夾裡面有 gauge.jpg
                        img: "./images/gauge.jpg", 
                        pos: { x: -0.005, y: 0.208, z: 0.054 },
                        
                        // ★★★ 這裡設定第二層彈窗的內容 ★★★
                        detail: {
                            title: "壓力錶內部構造",
                            text: "壓力錶內部由波登管(Bourdon tube)組成。當氣體壓力進入時，銅管會像吹捲笛一樣拉直，帶動齒輪轉動指針。若是受潮生鏽，會導致齒輪卡死。",
                            // 如果第二層也要圖片，也可以放： img: "./images/gauge_inner.jpg"
                        }
                    },
                    { 
                        title: "安全插梢", 
                        text: "用途：防止誤觸發。檢查重點：確認插梢是否固定完好，鉛封(封條)必須未脫落。", 
                        img: "./images/pin.jpg", // 這是網路圖片
                        pos: { x: 0.031, y: 0.232, z: 0.022 } 
                    },
                    { 
                        title: "瓶身狀態", 
                        text: "每三年需進行水壓測試。檢查重點：有無嚴重生鏽、腐蝕或變形。", 
                        img: "", // 沒圖片就留空
                        pos: { x: 0.045, y: -0.005, z: 0.057 } 
                    },
                    { 
                        title: "皮管與噴嘴", 
                        text: "檢查重點：確認無龜裂、老化或阻塞。", 
                        img: "./images/Nozzle.jpg",
                        pos: { x: -0.068, y: -0.067, z: -0.052 } 
                    }
                ]
            }
        ];

        // 2. 初始化場景
        let loadedModel = null;
        const labelElements = [];
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0.8, 0.5, 0.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-wrapper').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(2, 5, 2);
        scene.add(dirLight);

        const loader = new GLTFLoader();

        function focusOnPoint(targetPos) {
            const target = new THREE.Vector3(targetPos.x, targetPos.y, targetPos.z);
            const direction = target.clone().normalize();
            const safetyDistance = 0.5; 
            const newCamPos = direction.multiplyScalar(safetyDistance);

            new Tween(camera.position)
                .to({ x: newCamPos.x, y: newCamPos.y, z: newCamPos.z }, 1200)
                .easing(Easing.Cubic.Out)
                .onUpdate(() => camera.lookAt(target))
                .start();

            new Tween(controls.target)
                .to({ x: target.x, y: target.y, z: target.z }, 1000)
                .easing(Easing.Quadratic.Out)
                .start();
        }

        // ★★★ 核心功能：顯示第一層與第二層視窗 ★★★
        function showMessage(pointData) {
            const box = document.getElementById('message-box');
            const imgTag = document.getElementById('msg-img');
            const imgContainer = document.getElementById('msg-img-container');
            const btnMore = document.getElementById('btn-more-info');
            
            // 每次打開新視窗時，先把第二層關掉，避免混亂
            document.getElementById('message-box-level2').style.display = 'none';

            // 1. 填入第一層內容
            document.getElementById('msg-title').innerText = pointData.title;
            document.getElementById('msg-content').innerText = pointData.text;

            // 處理圖片
            if (pointData.img && pointData.img !== "") {
                imgTag.src = pointData.img;
                imgContainer.style.display = 'block';
            } else {
                imgTag.src = "";
                imgContainer.style.display = 'none';
            }

            // 2. 判斷是否有「詳細資料 (detail)」，有的話顯示按鈕
            if (pointData.detail) {
                btnMore.style.display = 'block'; // 顯示按鈕
                
                // 設定按鈕點擊事件：打開第二層視窗
                btnMore.onclick = () => {
                    const box2 = document.getElementById('message-box-level2');
                    document.getElementById('msg-title-2').innerText = pointData.detail.title;
                    document.getElementById('msg-content-2').innerText = pointData.detail.text;
                    
                    const img2 = document.getElementById('msg-img-2');
                    if (pointData.detail.img) {
                        img2.src = pointData.detail.img;
                        img2.style.display = 'block';
                    } else {
                        img2.style.display = 'none';
                    }
                    
                    box2.style.display = 'block'; // 顯示第二層
                };
            } else {
                btnMore.style.display = 'none'; // 沒詳細資料就隱藏按鈕
            }

            box.style.display = 'block'; // 顯示第一層
            if (pointData.pos) focusOnPoint(pointData.pos);
        }

        function loadObject(data) {
            if (loadedModel) scene.remove(loadedModel);
            document.getElementById('labels-container').innerHTML = "";
            document.getElementById('parts-list').innerHTML = "";
            document.getElementById('message-box').style.display = 'none';
            document.getElementById('message-box-level2').style.display = 'none';
            labelElements.length = 0;

            loader.load(data.file, (gltf) => {
                loadedModel = gltf.scene;
                const box = new THREE.Box3().setFromObject(loadedModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const scale = 0.5 / Math.max(size.x, size.y, size.z);
                loadedModel.position.sub(center);
                loadedModel.scale.multiplyScalar(scale);
                scene.add(loadedModel);

                data.points.forEach((p, i) => {
                    // 左側列表
                    const item = document.createElement('div');
                    item.className = 'part-item';
                    item.innerText = `${i+1}. ${p.title}`;
                    item.onclick = () => showMessage(p); // 傳入整個物件
                    document.getElementById('parts-list').appendChild(item);

                    // 3D 標籤
                    const label = document.createElement('div');
                    label.className = 'annotation';
                    label.innerText = i + 1;
                    label.onclick = (e) => {
                        e.stopPropagation();
                        showMessage(p); // 傳入整個物件
                    };
                    document.getElementById('labels-container').appendChild(label);
                    labelElements.push({ div: label, pos: new THREE.Vector3(p.pos.x, p.pos.y, p.pos.z) });
                });
            });
        }

        allData.forEach(obj => {
            const btn = document.createElement('button');
            btn.className = 'model-btn';
            btn.innerText = obj.name;
            btn.onclick = () => {
                document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadObject(obj);
                controls.reset();
            };
            document.getElementById('cat-' + obj.category).appendChild(btn);
        });

        document.getElementById('reset-btn').onclick = () => {
            new Tween(camera.position).to({ x: 0.8, y: 0.5, z: 0.8 }, 800).start();
            new Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 800).start();
        };

        document.querySelector('.model-btn').click();

        // 座標偵測工具
        window.addEventListener('mousedown', (event) => {
            if (!loadedModel) return;
            const mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(loadedModel, true);

            if (intersects.length > 0) {
                const p = intersects[0].point;
                const str = `pos: { x: ${p.x.toFixed(3)}, y: ${p.y.toFixed(3)}, z: ${p.z.toFixed(3)} }`;
                document.getElementById('coord-output').innerText = str;
                navigator.clipboard.writeText(str);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            updateTween();
            controls.update();
            renderer.render(scene, camera);
    
            const svg = document.getElementById('line-canvas');
            if(svg) svg.innerHTML = ''; 

            labelElements.forEach(item => {
                const rawPos = item.pos.clone().project(camera);
                const startX = (rawPos.x * 0.5 + 0.5) * window.innerWidth;
                const startY = (-(rawPos.y) * 0.5 + 0.5) * window.innerHeight;
                
                const offsetX = 60; 
                const endX = startX + offsetX;
                const endY = startY - 60;

                item.div.style.left = `${endX}px`;
                item.div.style.top = `${endY}px`;
                item.div.style.transform = `translate(-50%, -50%)`;
                item.div.style.display = (rawPos.z > 1) ? 'none' : 'block';

                if (item.div.style.display === 'block' && svg) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', startX);
                    line.setAttribute('y1', startY);
                    line.setAttribute('x2', endX);
                    line.setAttribute('y2', endY);
                    line.setAttribute('stroke', 'rgba(255,255,255,0.4)');
                    line.setAttribute('stroke-width', '1.5');
                    svg.appendChild(line);
                }
            });
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
