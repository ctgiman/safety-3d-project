<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧工安互動教學系統</title>
    <style>
        :root { --primary: #3498db; --bg: #1a1a1a; --panel: rgba(30, 30, 30, 0.95); }
        body { margin: 0; font-family: 'Microsoft JhengHei', sans-serif; background: #000; color: white; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 100vh; display: flex; }

        /* 指引線畫布 */
        #line-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
        }

        /* 左側：部位清單 */
        #left-panel { position: absolute; left: 20px; top: 100px; width: 220px; z-index: 100; pointer-events: none; }
        .part-item {
            pointer-events: auto; background: var(--panel); border-left: 4px solid var(--primary);
            padding: 12px; margin-bottom: 8px; cursor: pointer; border-radius: 0 5px 5px 0;
            transition: 0.3s; font-size: 14px; box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        .part-item:hover { background: var(--primary); color: white; transform: translateX(8px); }

        /* 右側：物件清單 */
        #right-panel {
            position: absolute; right: 0; top: 0; bottom: 0; width: 280px;
            background: var(--panel); border-left: 1px solid #444; padding: 20px;
            z-index: 100; overflow-y: auto;
        }
        .category-title { color: #888; font-size: 12px; text-transform: uppercase; margin: 20px 0 10px; border-bottom: 1px solid #444; }
        .model-btn {
            width: 100%; padding: 12px; margin-bottom: 10px; background: #333; border: none;
            color: white; text-align: left; cursor: pointer; border-radius: 5px; transition: 0.3s;
        }
        .model-btn:hover { background: #444; }
        .model-btn.active { background: var(--primary); font-weight: bold; }

        #reset-btn {
            width: 100%; padding: 12px; background: #e67e22; color: white; border: none;
            border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px; transition: 0.3s;
        }
        #reset-btn:hover { background: #d35400; }

        /* 3D 標籤 */
        .annotation {
            position: absolute; width: 26px; height: 26px;
            background: #ff3d00; border: 2px solid #ffffff; border-radius: 50%;
            color: white; font-weight: bold; text-align: center; line-height: 22px;
            font-size: 12px; box-shadow: 0 0 15px rgba(255, 61, 0, 0.8);
            cursor: pointer; z-index: 1000; pointer-events: auto;
        }

            /* 下方訊息視窗 */
           /* 資訊彈窗 (Modal) */
        #message-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%); /* 絕對置中 */
            width: 400px;
            max-width: 90vw; /* 手機版不超出版面 */
            background: rgba(20, 20, 20, 0.95); /* 深色背景 */
            border: 1px solid var(--primary);
            border-radius: 10px;
            padding: 0; /* 內距交給內部元素 */
            z-index: 2000;
            display: none; /* 預設隱藏 */
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden; /* 讓圖片圓角不溢出 */
            animation: fadeIn 0.3s ease-out;
        }

        /* 彈窗內的圖片區域 */
        #msg-img-container {
            width: 100%;
            height: 200px; /* 固定圖片高度 */
            background: #333;
            overflow: hidden;
            position: relative;
        }

        #msg-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 保持比例填滿，不會變形 */
            display: block;
        }

        /* 彈窗內容區域 */
        .msg-body { padding: 20px; }

        #msg-title { margin-top: 0; color: var(--primary); font-size: 22px; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px; }
        #msg-content { line-height: 1.6; color: #ddd; font-size: 15px; }

        /* 關閉按鈕 */
        .close-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.5); border: none; color: white;
            width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; font-weight: bold; z-index: 10;
        }
        .close-btn:hover { background: var(--primary); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        #debug-tool {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.9); border: 1px solid #00ff00; color: #00ff00;
            padding: 10px; font-family: monospace; font-size: 11px; z-index: 300;
        }
    </style>
</head>
<body>

    <div id="container">
        <svg id="line-canvas"></svg>

        <div id="left-panel">
            <div style="color:var(--primary); margin-bottom:12px; font-weight:bold; letter-spacing:1px;">部位檢查指引</div>
            <div id="parts-list"></div>
        </div>

        <div id="right-panel">
            <button id="reset-btn">🏠 重置視角 / 置中</button>
            <h2 style="margin:0 0 15px 0; font-size: 20px;">工安器材庫</h2>
            <div class="category-title">防護具類</div>
            <div id="cat-ppe"></div>
            <div class="category-title">消防器材類</div>
            <div id="cat-fire"></div>
        </div>

        <div id="canvas-wrapper" style="width:100%; height:100%;"></div>
        <div id="labels-container"></div>

        <div id="message-box">
            <button onclick="this.parentElement.style.display='none'" style="float:right; background:none; border:none; color:white; cursor:pointer; font-size:20px;">✕</button>
            <h3 id="msg-title" style="margin-top:0; color:var(--primary);">標題</h3>
            <p id="msg-content" style="line-height:1.6; margin-bottom:0;"></p>
        </div>

        <div id="debug-tool">
            <button onclick="this.parentElement.style.display='none'">關閉工具</button><br>
            <strong>座標偵測器</strong> (點擊模型獲取)<br>
            <span id="coord-output">x: -, y: -, z: -</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        // 修正後的匯入方式
        import * as TWEEN from 'https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js';

        // 1. 資料庫
        const allData = [
            {
                id: "helmet",
                category: "ppe",
                name: "工程安全帽",
                file: "./models/model3.glb",
                points: [
                    { title: "帽殼狀態", text: "檢查是否有龜裂或遭受撞擊之白化痕跡。", pos: { x: 0.007, y: 0.249, z: -0.028 } },
                    { title: "頤帶扣環", text: "確認扣環是否牢固，無斷裂痕跡。", pos: { x: 0.105, y: -0.101, z: -0.016 } },
                    { title: "內襯", text: "檢查緩衝材質是否老化、龜裂。", pos: { x: -0.123, y: 0.161, z: -0.017 } },
                    { title: "帽緣/帽沿", text: "確認無變形或缺損。", pos: { x: 0.007, y: 0.015, z: 0.207 } }
                ]
            },
            {
                id: "extinguisher",
                category: "fire",
                name: "乾粉滅火器",
                file: "./models/fireextinguisher.glb",
                points: [
                { 
                    title: "壓力錶指針", 
                    text: "【正常範圍】：指針必須位於綠色區塊。\n【異常】：偏左(黃色)代表壓力不足，需送檢填充；偏右(紅色)代表壓力過大，有爆裂風險。", 
                    img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Pressure_gauge_of_fire_extinguisher.jpg/640px-Pressure_gauge_of_fire_extinguisher.jpg", // 這裡放圖片網址
                    pos: { x: -0.005, y: 0.208, z: 0.054 } 
                },
                { 
                    title: "安全插梢", 
                    text: "用途：防止誤觸發。\n檢查重點：確認插梢是否固定完好，鉛封(封條)必須未脫落、未斷裂。", 
                    img: "https://thumbs.dreamstime.com/b/safety-pin-red-fire-extinguisher-close-up-169036733.jpg", 
                    pos: { x: 0.031, y: 0.232, z: 0.022 } 
                },
                { 
                    title: "瓶身狀態", 
                    text: "每三年需進行水壓測試。檢查重點：有無嚴重生鏽、腐蝕或變形。", 
                    // 如果沒有圖片，這欄可以不寫，或留空字串 ""，程式會自動只顯示文字
                    img: "", 
                    pos: { x: 0.038, y: -0.142, z: 0.001 } 
                },
                { 
                    title: "皮管與噴嘴", 
                    text: "檢查重點：確認無龜裂、老化或阻塞。使用時應握住噴嘴前端。", 
                    img: "https://media.istockphoto.com/id/175435985/photo/fire-extinguisher-hose.jpg?s=612x612&w=0&k=20&c=GzWJ6Z-I_fQ_1BvTjQW8qJk_wXNn7W_1qV_2r_3t_4=",
                    pos: { x: -0.068, y: -0.067, z: -0.052 } 
                }
            ]
        },
        // ... 安全帽的資料也可以如法炮製 ...
    ];

        // 2. 初始化場景
        let loadedModel = null;
        const labelElements = [];
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0.8, 0.5, 0.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-wrapper').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(2, 5, 2);
        scene.add(dirLight);

        const loader = new GLTFLoader();

        // 自動導覽功能：相機平滑移動
      // 自動導覽功能：避免穿透模型的平滑移動
function focusOnPoint(targetPos) {
    const target = new THREE.Vector3(targetPos.x, targetPos.y, targetPos.z);
    
    // 1. 計算從中心到目標點的向量，並將其標準化 (代表該點的「方向」)
    const direction = target.clone().normalize();
    
    // 2. 設定一個「安全平面」的距離 (例如 0.4 單位)，這能保證相機在模型外
    const safetyDistance = 0.5; 
    const newCamPos = direction.multiplyScalar(safetyDistance);

    // 3. 執行相機移動動畫
    new TWEEN.Tween(camera.position)
        .to({ x: newCamPos.x, y: newCamPos.y, z: newCamPos.z }, 1200) // 稍微放慢一點點
        .easing(TWEEN.Easing.Cubic.Out) // 使用更平滑的 Cubic 曲線
        .onUpdate(() => {
            // 在移動過程中，相機始終盯著目標，避免亂晃
            camera.lookAt(target);
        })
        .start();

    // 4. 同時更新 OrbitControls 的中心點，讓後續手動旋轉是以該點為中心
    new TWEEN.Tween(controls.target)
        .to({ x: target.x, y: target.y, z: target.z }, 1000)
        .easing(TWEEN.Easing.Quadratic.Out)
        .start();
}
        function showMessage(title, text, pos, imgUrl) {
            const box = document.getElementById('message-box');
            const imgTag = document.getElementById('msg-img');
            const imgContainer = document.getElementById('msg-img-container');

            // 設定標題與文字
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-content').innerText = text;

            // 設定圖片邏輯
            if (imgUrl) {
                imgTag.src = imgUrl;
                imgContainer.style.display = 'block'; // 有圖就顯示
            } else {
                imgContainer.style.display = 'none'; // 沒圖就把圖片框藏起來，只顯示文字
            }

            box.style.display = 'block';

            // 觸發相機導覽
            if (pos) focusOnPoint(pos);
        }

        function loadObject(data) {
            if (loadedModel) scene.remove(loadedModel);
            document.getElementById('labels-container').innerHTML = "";
            document.getElementById('parts-list').innerHTML = "";
            document.getElementById('message-box').style.display = 'none';
            labelElements.length = 0;

            loader.load(data.file, (gltf) => {
                loadedModel = gltf.scene;
                const box = new THREE.Box3().setFromObject(loadedModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const scale = 0.5 / Math.max(size.x, size.y, size.z);
                loadedModel.position.sub(center);
                loadedModel.scale.multiplyScalar(scale);
                scene.add(loadedModel);

                data.points.forEach((p, i) => {
                    const item = document.createElement('div');
                    item.className = 'part-item';
                    item.innerText = `${i+1}. ${p.title}`;
                    item.onclick = () => showMessage(p.title, p.text, p.pos);
                    document.getElementById('parts-list').appendChild(item);

                    const label = document.createElement('div');
                    label.className = 'annotation';
                    label.innerText = i + 1;
                    label.onclick = (e) => {
                        e.stopPropagation();
                        showMessage(p.title, p.text, p.pos);
                    };
                    document.getElementById('labels-container').appendChild(label);
                    labelElements.push({ div: label, pos: new THREE.Vector3(p.pos.x, p.pos.y, p.pos.z) });
                });
            });
        }

        // 初始化右側選單
        allData.forEach(obj => {
            const btn = document.createElement('button');
            btn.className = 'model-btn';
            btn.innerText = obj.name;
            btn.onclick = () => {
                document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadObject(obj);
                controls.reset();
            };
            document.getElementById('cat-' + obj.category).appendChild(btn);
        });

        document.getElementById('reset-btn').onclick = () => {
            new TWEEN.Tween(camera.position).to({ x: 0.8, y: 0.5, z: 0.8 }, 800).start();
            new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 800).start();
        };

        document.querySelector('.model-btn').click();

        // 座標偵測
        window.addEventListener('mousedown', (event) => {
            if (!loadedModel) return;
            const mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(loadedModel, true);

            if (intersects.length > 0) {
                const p = intersects[0].point;
                const str = `pos: { x: ${p.x.toFixed(3)}, y: ${p.y.toFixed(3)}, z: ${p.z.toFixed(3)} }`;
                document.getElementById('coord-output').innerText = str;
                navigator.clipboard.writeText(str);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update(); // 處理相機動畫
            controls.update();
            renderer.render(scene, camera);
    
            const svg = document.getElementById('line-canvas');
            svg.innerHTML = ''; 

            labelElements.forEach(item => {
                const rawPos = item.pos.clone().project(camera);
                
                // A. 原始位置 (模型上的點)
                const startX = (rawPos.x * 0.5 + 0.5) * window.innerWidth;
                const startY = (-(rawPos.y) * 0.5 + 0.5) * window.innerHeight;
                
                // B. 標籤位置 (稍微偏移讓出空間)
                const offsetX = 60; 
                const offsetY = -60;
                const endX = startX + offsetX;
                const endY = startY + offsetY;

                item.div.style.left = `${endX}px`;
                item.div.style.top = `${endY}px`;
                item.div.style.transform = `translate(-50%, -50%)`;
                item.div.style.display = (rawPos.z > 1) ? 'none' : 'block';

                // 畫指引線
                if (item.div.style.display === 'block') {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', startX);
                    line.setAttribute('y1', startY);
                    line.setAttribute('x2', endX);
                    line.setAttribute('y2', endY);
                    line.setAttribute('stroke', 'rgba(255,255,255,0.4)');
                    line.setAttribute('stroke-width', '1.5');
                    svg.appendChild(line);
                }
            });
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
