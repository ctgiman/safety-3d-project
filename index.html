<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧工安互動教學系統 v1.0</title>
    <style>
        :root { --primary: #3498db; --accent: #e67e22; --bg: #1a1a1a; --panel: rgba(30, 30, 30, 0.95); }
        body { margin: 0; font-family: 'Microsoft JhengHei', sans-serif; background: #000; color: white; overflow: hidden; }
        
        #container { 
            position: relative; width: 100vw; height: 100vh; display: flex; 
            overflow: hidden; 
        }

        /* === 優化後的載入畫面 === */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--primary);
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .loading-bar-container {
            width: 200px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin-top: 10px;
        }
        #loading-bar {
            width: 0%; height: 100%; background: var(--primary); transition: width 0.2s;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 指引線畫布 */
        #line-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
        }

        /* 左側：部位清單 */
        #left-panel { position: absolute; left: 20px; top: 100px; width: 240px; z-index: 100; pointer-events: none; }
        .part-item {
            pointer-events: auto; background: var(--panel); border-left: 4px solid var(--primary);
            padding: 12px 15px; margin-bottom: 8px; cursor: pointer; border-radius: 0 5px 5px 0;
            transition: 0.3s; font-size: 14px; box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            display: flex; align-items: center;
        }
        .part-item:hover { background: var(--primary); color: white; transform: translateX(5px); }
        .part-index { background: rgba(255,255,255,0.2); border-radius: 50%; width: 20px; height: 20px; text-align: center; line-height: 20px; margin-right: 10px; font-size: 12px; }

        /* 右側：選單 */
        #right-panel {
            position: absolute; right: 0; top: 0; bottom: 0; width: 280px;
            background: var(--panel); border-left: 1px solid #444; padding: 20px;
            z-index: 100; overflow-y: auto; display: flex; flex-direction: column;
        }
        .category-title { color: #888; font-size: 12px; text-transform: uppercase; margin: 20px 0 10px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .model-btn {
            width: 100%; padding: 12px; margin-bottom: 10px; background: #333; border: none;
            color: white; text-align: left; cursor: pointer; border-radius: 5px; transition: 0.3s;
            border-left: 3px solid transparent;
        }
        .model-btn:hover { background: #444; }
        .model-btn.active { background: #2c3e50; border-left: 3px solid var(--primary); font-weight: bold; }

        #reset-btn {
            width: 100%; padding: 12px; background: var(--accent); color: white; border: none;
            border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px; transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        #reset-btn:hover { background: #d35400; }

        /* 3D 標籤 */
        .annotation {
            position: absolute; width: 28px; height: 28px;
            background: rgba(255, 61, 0, 0.9); border: 2px solid #ffffff; border-radius: 50%;
            color: white; font-weight: bold; text-align: center; line-height: 24px;
            font-size: 14px; box-shadow: 0 0 15px rgba(255, 61, 0, 0.6);
            cursor: pointer; z-index: 1000; pointer-events: auto;
            transition: transform 0.2s;
        }
        .annotation:hover { transform: scale(1.2); background: #ff5722; }

        /* 第一層資訊彈窗 */
        #message-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 420px; max-width: 90vw; background: rgba(20, 20, 20, 0.98);
            border: 1px solid var(--primary); border-radius: 8px; padding: 0;
            z-index: 2000; display: none; box-shadow: 0 0 40px rgba(0,0,0,0.8);
            animation: fadeIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        #msg-img-container {
            width: 100%; height: 220px; background: #000; position: relative; display: none; border-bottom: 1px solid #333;
        }
        #msg-img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .msg-body { padding: 25px; }
        #msg-title { margin-top: 0; color: var(--primary); font-size: 24px; border-bottom: 1px solid #444; padding-bottom: 12px; margin-bottom: 15px; }
        #msg-content { line-height: 1.7; color: #ccc; font-size: 15px; margin: 0; white-space: pre-line; }
        
        #btn-more-info {
            display: none; width: 100%; margin-top: 20px; padding: 12px;
            background: linear-gradient(to right, var(--primary), #2980b9);
            color: white; border: none; border-radius: 5px; cursor: pointer;
            font-size: 14px; font-weight: bold; transition: 0.2s;
        }
        #btn-more-info:hover { opacity: 0.9; transform: translateY(-2px); }

        /* 第二層詳細構造彈窗 */
        #message-box-level2 {
            position: absolute; top: 55%; left: 55%; transform: translate(-50%, -50%);
            width: 380px; max-width: 85vw; background: #222; border: 1px solid var(--accent);
            border-radius: 8px; z-index: 2100; display: none;
            box-shadow: 0 0 50px rgba(0,0,0,0.9); padding: 25px;
            animation: fadeIn 0.3s ease-out;
        }

        .close-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; font-weight: bold; z-index: 10; transition: 0.2s;
        }
        .close-btn:hover { background: #c0392b; }

        /* 操作提示與 Debug 工具 */
        #controls-hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.5); font-size: 12px; pointer-events: none;
            text-align: center;
            
        }
        #debug-tool {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.8); border: 1px solid #00ff00; color: #00ff00;
            padding: 10px; font-family: monospace; font-size: 11px; z-index: 300;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p>系統資源加載中... <span id="progress-text">0%</span></p>
        <div class="loading-bar-container">
            <div id="loading-bar"></div>
        </div>
    </div>

    <div id="container">
        <svg id="line-canvas"></svg>

        <div id="left-panel">
            <div style="color:var(--primary); margin-bottom:15px; font-weight:bold; letter-spacing:1px; border-bottom:1px solid #444; padding-bottom:10px;">
                🔍 檢查項目列表
            </div>
            <div id="parts-list"></div>
        </div>

        <div id="right-panel">
            <button id="reset-btn">
                <span>🏠</span> 重置視角 / 全覽
            </button>
            <h2 style="margin:0 0 10px 0; font-size: 20px;">工安器材庫</h2>
            <p style="color:#666; font-size:12px; margin-bottom:20px;">選擇模型以開始互動教學</p>
            
            <div class="category-title">防護具類</div>
            <div id="cat-ppe"></div>
            
            <div class="category-title">消防器材類</div>
            <div id="cat-fire"></div>
        </div>

        <div id="canvas-wrapper" style="flex: 1; width: 100%; height: 100%;"></div>
        <div id="labels-container"></div>

        <div id="controls-hint">
            左鍵：旋轉場景 | 右鍵：平移 | 滾輪：縮放
        </div>

        <div id="message-box">
            <button class="close-btn" onclick="closeAllMessages()">✕</button>
            <div id="msg-img-container">
                <img id="msg-img" src="" alt="部位圖片" onerror="this.style.display='none'">
            </div>
            <div class="msg-body">
                <h3 id="msg-title">標題</h3>
                <p id="msg-content">內容描述...</p>
                <button id="btn-more-info">🔍 查看詳細構造原理</button>
            </div>
        </div>

        <div id="message-box-level2">
            <button class="close-btn" onclick="this.parentElement.style.display='none'">✕</button>
            <h3 id="msg-title-2" style="margin-top:0; color:var(--accent); border-bottom:1px solid #555; padding-bottom:10px;">詳細構造</h3>
            <img id="msg-img-2" src="" style="width:100%; border-radius:5px; margin:10px 0; display:none;" onerror="this.style.display='none'">
            <p id="msg-content-2" style="color:#ddd; line-height:1.6; font-size:14px; margin:0;">更多細節...</p>
        </div>

       <div id="debug-tool"
     style="
        position:absolute;
        bottom:20px;
        left:20px;
        background:rgba(0,0,0,0.85);
        border:1px solid #f1c40f;
        color:#f1c40f;
        padding:12px;
        font-family:monospace;
        font-size:11px;
        z-index:500;
        width:260px;
        border-radius:8px;
     ">

    <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>🎯 視角 / 座標工具</strong>
        <button id="close-debug"
                style="cursor:pointer; font-size:10px;">✕</button>
    </div>

    <div style="margin-top:8px; color:#fff;" id="debug-output">
        點擊模型取得座標與視角
    </div>

    <button id="copy-debug"
            style="
                width:100%;
                margin-top:8px;
                padding:6px;
                background:#f1c40f;
                color:#000;
                border:none;
                cursor:pointer;
                font-weight:bold;
            ">
        📋 複製點位 + 黃金視角
    </button>
</div>


    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Tween, Easing, update as updateTween } from 'https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js';

        /* * ==========================================
         * 1. 數據中心 (DATA CENTER)
         * 在這裡新增或修改你的模型與檢查點
         * ==========================================
         */
        const allData = [
              {
                id: "helmet",
                category: "ppe",
                name: "工程安全帽",
                file: "./models/model3.glb",
                points: [
                    { title: "帽殼狀態", text: "檢查是否有龜裂或遭受撞擊之白化痕跡。若有受損應立即更換。", pos: { x: 0.007, y: 0.249, z: -0.028 } },
                    { title: "頤帶扣環", text: "確認扣環是否牢固，無斷裂痕跡。工作時必須扣好。", pos: { x: 0.105, y: -0.101, z: -0.016 } },
                    { title: "內部緩衝襯", text: "檢查緩衝材質是否老化、龜裂。這是吸收衝擊的關鍵。", pos: { x: -0.123, y: 0.161, z: -0.017 } }
                ]
            },
            {
                id: "extinguisher",
                category: "fire",
                name: "乾粉滅火器",
                file: "./models/fireextinguisher.glb",
                points: [
                    { 
                        title: "1. 壓力錶 (Pressure Gauge)", 
                        text: "檢查重點：指針必須位於綠色區塊。綠色代表壓力正常，黃色或紅色代表異常，需要送修。", 
                        img: "./images/gauge.jpg", // 暫時用網路圖
                        pos: { x: -0.005, y: 0.208, z: 0.054 },
                        detail: {
                            title: "壓力錶構造",
                            text: "內部使用波登管(Bourdon tube)構造。當氣體壓力進入時，銅管拉直帶動指針。受潮可能導致指針卡死。",
                            img: "https://via.placeholder.com/400x300?text=Inside+Structure"
                        }
                    },
                    { 
                        title: "2. 安全插梢 (Safety Pin)", 
                        text: "檢查重點：確認插梢是否變形，以及鉛封是否完整。若鉛封斷裂，代表可能已被使用過。", 
                        img: "./images/pin.jpg",
                        pos: { x: 0.031, y: 0.232, z: 0.022 } 
                    },
                    { 
                        title: "3. 皮管與噴嘴", 
                        text: "檢查重點：拿起皮管彎折檢查，確認無龜裂、老化。並檢查噴嘴口有無異物堵塞。", 
                        img: "./images/Nozzle.jpg",
                        pos: { x: -0.068, y: -0.067, z: -0.052 } 
                    },
                    {
                        title: "4. 壓把測試",
                        text: "檢查重點：確認壓把無變形、生鏽卡死。使用時需用力壓下以釋放藥劑。",
                        pos: { x: 0.085, y: 0.237, z: 0.069 },
                        view: {
                        cam: {"x":0.302,"y":0.341,"z":0.291},
                        target: {"x":0.055,"y":0.144,"z":0.045}
                      }
                    }
                    },
                    { 
                        title: "5. 瓶身狀態", 
                        text: "檢查重點：檢視瓶身底部與焊接處，有無嚴重生鏽。鏽蝕嚴重之鋼瓶有爆裂風險。", 
                        pos: { x: 0.063, y: -0.109, z: 0.031 } 
                    },
                    {
                        title: "6. 合格標籤 (Label)",
                        text: "【檢查重點】：\n確認「下次檢查日期」或「藥劑有效期限」。\n每三年應進行水壓測試檢驗。",
                        pos: { x: -0.044, y: -0.093, z: 0.061 }
                    }
                ]
            }
        ];

        /* ========================================== */

        let loadedModel = null;
        const labelElements = [];
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a); // 深灰背景比較有質感

        // 初始化相機
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(1, 0.8, 1);

        // 初始化渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 優化效能
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('canvas-wrapper').appendChild(renderer.domElement);

        // 軌道控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 燈光設置
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
        mainLight.position.set(5, 10, 7);
        scene.add(mainLight);
        const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
        backLight.position.set(-5, 5, -5);
        scene.add(backLight);

        const loader = new GLTFLoader();

        // 全域函數供 HTML 按鈕呼叫
        window.closeAllMessages = () => {
            document.getElementById('message-box').style.display = 'none';
            document.getElementById('message-box-level2').style.display = 'none';
        };

        // 核心功能：鏡頭移動
        function focusOnPoint(targetPos) {
            const target = new THREE.Vector3(targetPos.x, targetPos.y, targetPos.z);
            
            // 計算最佳攝影機位置 (避免太近)
            const offset = camera.position.clone().sub(controls.target).normalize().multiplyScalar(0.4); 
            const newCamPos = target.clone().add(offset);

            // 確保相機Y軸不會太低
            if(newCamPos.y < target.y) newCamPos.y = target.y + 0.1;

            new Tween(camera.position)
                .to({ x: newCamPos.x, y: newCamPos.y, z: newCamPos.z }, 1000)
                .easing(Easing.Cubic.Out)
                .start();

            new Tween(controls.target)
                .to({ x: target.x, y: target.y, z: target.z }, 800)
                .easing(Easing.Quadratic.Out)
                .start();
        }

        // 核心功能：顯示訊息
        function showMessage(pointData) {
            const box = document.getElementById('message-box');
            const imgTag = document.getElementById('msg-img');
            const imgContainer = document.getElementById('msg-img-container');
            const btnMore = document.getElementById('btn-more-info');
            
            document.getElementById('message-box-level2').style.display = 'none';

            document.getElementById('msg-title').innerText = pointData.title;
            document.getElementById('msg-content').innerText = pointData.text;

            // 圖片邏輯處理
            if (pointData.img && pointData.img !== "") {
                imgTag.src = pointData.img;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.style.display = 'none';
            }

            // 詳細按鈕邏輯
            if (pointData.detail) {
                btnMore.style.display = 'block';
                btnMore.onclick = () => {
                    const box2 = document.getElementById('message-box-level2');
                    document.getElementById('msg-title-2').innerText = pointData.detail.title;
                    document.getElementById('msg-content-2').innerText = pointData.detail.text;
                    const img2 = document.getElementById('msg-img-2');
                    if (pointData.detail.img) { 
                        img2.src = pointData.detail.img; 
                        img2.style.display = 'block'; 
                    } else { 
                        img2.style.display = 'none'; 
                    }
                    box2.style.display = 'block';
                };
            } else {
                btnMore.style.display = 'none';
            }

            box.style.display = 'block';
            if (pointData.pos) focusOnPoint(pointData.pos);
        }

        // 核心功能：載入模型
        function loadObject(data) {
            const loadingScreen = document.getElementById('loading-screen');
            const progressText = document.getElementById('progress-text');
            const loadingBar = document.getElementById('loading-bar');
            
            // 重置載入畫面
            loadingScreen.style.opacity = '1';
            loadingScreen.style.display = 'flex';
            progressText.innerText = '0%';
            loadingBar.style.width = '0%';

            // 清理舊場景
            if (loadedModel) scene.remove(loadedModel);
            document.getElementById('labels-container').innerHTML = "";
            document.getElementById('parts-list').innerHTML = "";
            window.closeAllMessages();
            labelElements.length = 0;

            loader.load(data.file, 
                (gltf) => {
                    // 載入成功：強制顯示 100%
                    progressText.innerText = '100%';
                    loadingBar.style.width = '100%';
                    
                    setTimeout(() => {
                        loadingScreen.style.opacity = '0';
                        setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);
                    }, 500); // 停留 0.5秒

                    loadedModel = gltf.scene;
                    
                    // 自動縮放模型至適當大小
                    const box = new THREE.Box3().setFromObject(loadedModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 0.6 / maxDim; // 設定標準大小為 0.6 單位
                    
                    loadedModel.position.sub(center); // 歸零
                    loadedModel.scale.multiplyScalar(scale);
                    
                    scene.add(loadedModel);

                    // 生成標籤與清單
                    data.points.forEach((p, i) => {
                        // 左側清單
                        const item = document.createElement('div');
                        item.className = 'part-item';
                        item.innerHTML = `<span class="part-index">${i+1}</span> ${p.title}`;
                        item.onclick = () => showMessage(p);
                        document.getElementById('parts-list').appendChild(item);

                        // 3D 空間標籤
                        const label = document.createElement('div');
                        label.className = 'annotation';
                        label.innerText = i + 1;
                        label.onclick = (e) => { e.stopPropagation(); showMessage(p); };
                        
                        // 滑鼠懸停效果 (選用)
                        label.onmouseenter = () => { document.body.style.cursor = 'pointer'; };
                        label.onmouseleave = () => { document.body.style.cursor = 'default'; };

                        document.getElementById('labels-container').appendChild(label);
                        labelElements.push({ div: label, pos: new THREE.Vector3(p.pos.x, p.pos.y, p.pos.z) });
                    });
                },
                (xhr) => {
                    // 載入進度計算 (限制在 0-100)
                    if (xhr.lengthComputable && xhr.total > 0) {
                        const percent = Math.min(100, Math.round((xhr.loaded / xhr.total) * 100));
                        progressText.innerText = percent + '%';
                        loadingBar.style.width = percent + '%';
                    }
                },
                (error) => {
                    console.error('載入錯誤:', error);
                    progressText.innerText = '載入失敗';
                }
            );
        }

        // 初始化選單按鈕
        allData.forEach(obj => {
            const btn = document.createElement('button');
            btn.className = 'model-btn';
            btn.innerText = obj.name;
            btn.dataset.id = obj.id;
            btn.onclick = () => {
                document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadObject(obj);
                // 重置鏡頭位置
                new Tween(camera.position).to({ x: 1, y: 0.8, z: 1 }, 1000).start();
                new Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1000).start();
            };
            document.getElementById('cat-' + obj.category).appendChild(btn);
        });

        // 點擊重置按鈕
        document.getElementById('reset-btn').onclick = () => {
            new Tween(camera.position).to({ x: 1, y: 0.8, z: 1 }, 800).easing(Easing.Back.Out).start();
            new Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 800).start();
            window.closeAllMessages();
        };

        // 啟動預設模型 (這裡設定預設開啟滅火器)
        const defaultModel = document.querySelector(`button[data-id="extinguisher"]`);
        if(defaultModel) defaultModel.click();

        // ===== 視角 / 座標整合工具 =====
let lastDebugData = null;

// 關閉工具
document.getElementById('close-debug').onclick = () => {
    document.getElementById('debug-tool').style.display = 'none';
};

// 複製資料
document.getElementById('copy-debug').onclick = () => {
    if (!lastDebugData) return;

    navigator.clipboard.writeText(lastDebugData);
    alert('已複製點位與黃金視角');
};

// 點擊模型取得座標 + 視角
window.addEventListener('mousedown', (event) => {
    if (!loadedModel || event.button !== 0) return;

    if (
        event.target.closest('#left-panel') ||
        event.target.closest('#right-panel') ||
        event.target.closest('.annotation')
    ) return;

    const mouse = new THREE.Vector2(
        (event.clientX / window.innerWidth) * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
    );

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObject(loadedModel, true);

    if (hits.length === 0) return;

    const p = hits[0].point;

    const pos = {
        x: +p.x.toFixed(3),
        y: +p.y.toFixed(3),
        z: +p.z.toFixed(3)
    };

    const cam = {
        x: +camera.position.x.toFixed(3),
        y: +camera.position.y.toFixed(3),
        z: +camera.position.z.toFixed(3)
    };

    const target = {
        x: +controls.target.x.toFixed(3),
        y: +controls.target.y.toFixed(3),
        z: +controls.target.z.toFixed(3)
    };

    const output = `
{
  title: "新檢查點",
  text: "請補上說明",
  pos: ${JSON.stringify(pos)},
  view: {
    cam: ${JSON.stringify(cam)},
    target: ${JSON.stringify(target)}
  }
}
`.trim();

    document.getElementById('debug-output').innerText =
        `pos: ${JSON.stringify(pos)}\ncam: ${JSON.stringify(cam)}\ntarget: ${JSON.stringify(target)}`;

    lastDebugData = output;

    document.getElementById('debug-tool').style.display = 'block';
});


        // 動畫迴圈
        function animate() {
            requestAnimationFrame(animate);
            updateTween();
            controls.update();
            renderer.render(scene, camera);

            // 更新標籤位置與連線
            const svg = document.getElementById('line-canvas');
            if(svg) svg.innerHTML = ''; 
            
            labelElements.forEach(item => {
                const rawPos = item.pos.clone().project(camera); // 3D轉2D螢幕座標
                
                // 檢查是否在相機背面 (z > 1)
                if (rawPos.z > 1 || Math.abs(rawPos.x) > 1.1 || Math.abs(rawPos.y) > 1.1) {
                    item.div.style.display = 'none';
                    return;
                } else {
                    item.div.style.display = 'block';
                }

                const screenX = (rawPos.x * 0.5 + 0.5) * window.innerWidth;
                const screenY = (-(rawPos.y) * 0.5 + 0.5) * window.innerHeight;

                // 標籤偏移邏輯 (讓標籤飄在點的右上方)
                const labelX = screenX + 40;
                const labelY = screenY - 40;

                item.div.style.left = `${labelX}px`;
                item.div.style.top = `${labelY}px`;

                // 繪製 SVG 連線
                if (svg) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', screenX); 
                    line.setAttribute('y1', screenY);
                    line.setAttribute('x2', labelX + 14); // +14 是因為標籤寬度的一半
                    line.setAttribute('y2', labelY + 14);
                    line.setAttribute('stroke', 'rgba(255,255,255,0.5)');
                    line.setAttribute('stroke-width', '1');
                    svg.appendChild(line);
                    
                    // 畫一個小圓點在物體上
                    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    dot.setAttribute('cx', screenX);
                    dot.setAttribute('cy', screenY);
                    dot.setAttribute('r', '3');
                    dot.setAttribute('fill', 'var(--primary)');
                    svg.appendChild(dot);
                }
            });
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
